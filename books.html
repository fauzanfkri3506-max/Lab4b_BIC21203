<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Information</title>
</head>
<body>

    <h1>Book Information</h1>

    <h2>First Book Title</h2>
    <p id="firstTitle"></p>

    <h2>Second Book Author</h2>
    <p id="secondAuthor"></p>

    <h2>Genres of Both Books</h2>
    <div id="genres"></div>

    <p id="error" role="alert"></p>

    <script>
        async function loadBooks() {
            const error = document.getElementById("error");

            try {
                const response = await fetch("books.json");

                if (!response.ok) {
                    throw new Error("Unable to retrieve book data.");
                }

                const data = await response.json();

                if (!Array.isArray(data.books) || data.books.length < 2) {
                    throw new Error("The book data is incomplete.");
                }

                const firstBook = data.books[0];
                const secondBook = data.books[1];

                document.getElementById("firstTitle").textContent =
                    firstBook.title;

                document.getElementById("secondAuthor").textContent =
                    secondBook.author;

                const genresDiv = document.getElementById("genres");

                data.books.forEach(function(book) {
                    const paragraph = document.createElement("p");

                    paragraph.textContent =
                        book.title + " — " + book.genres.join(", ");

                    genresDiv.appendChild(paragraph);
                });

            } catch (err) {
                error.textContent =
                    "Sorry, the book data could not be loaded. " +
                    "Please check the JSON file and try again.";
            }
        }

        loadBooks();
    </script>

</body>
</html>
